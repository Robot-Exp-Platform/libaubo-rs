[package]
name = "libaubo"
version = "0.5.0"
edition = "2024"
authors = ["Yixing <yanjizhou312@163.com>"]
readme = "README.md"
repository = "https://github.com/Robot-Exp-Platform/libaubo-rs"
license = "Apache-2.0"
description = "Rust bindings for the Aubo robot"
categories = ["science::robotics"]
keywords = ["aubo", "robot"]

[lib]
name = "libaubo"
crate-type = ["cdylib", "rlib"]

[dependencies]
roplat_behavior = "0.9.0"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
